[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "percolacao"
version = "1.0.0"
description = "Percolacao de sitio em grade pequena resolvida exatamente: o polinomio inteiro, por forca bruta e por matriz de transferencia, com a dualidade como juiz."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "condeDeveloper" }]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Topic :: Scientific/Engineering :: Mathematics",
]

[project.scripts]
percolacao = "percolacao.__main__:main"

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
include = ["percolacao*"]

[tool.pytest.ini_options]
testpaths = ["testes"]
addopts = "-q"
